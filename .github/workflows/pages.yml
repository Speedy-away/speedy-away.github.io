name: Deploy WWB HOST
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/configure-pages@v5
      - name: Build project site with preserved repository downloads
        run: node scripts/host-project-pages.cjs "$RUNNER_TEMP/wwb-host-pages"
      - name: Verify links, size and native script identities
        run: node scripts/verify-host-project-pages.cjs "$RUNNER_TEMP/wwb-host-pages"
      - name: Verify canonical URLs and social previews
        run: node scripts/verify-host-metadata.cjs "$RUNNER_TEMP/wwb-host-pages"
      - name: Verify offline file identities and exploit cache closure
        run: node scripts/verify-host-offline.cjs "$RUNNER_TEMP/wwb-host-pages"
      - name: Verify complete game patch definitions and offline coverage
        run: node scripts/verify-all-game-patches.cjs "$RUNNER_TEMP/wwb-host-pages"
      - name: Verify all language pages and metadata
        run: node scripts/verify-host-locales.cjs "$RUNNER_TEMP/wwb-host-pages"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/wwb-host-pages
  deploy:
    timeout-minutes: 35
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          timeout: 1800000
