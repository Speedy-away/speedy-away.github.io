<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>afterglow</title>
    <!-- This page carries its own styles and starts its own module, and it
         loads NOTHING else. That duplicates a little of style.css, and it is
         deliberate: every subresource is one more allocation and one more
         timing shift in the process that core.js is about to groom, and this
         exploit is decided by exactly that. The landing page may use the
         shared stylesheet; this one may not. -->
    <style>
      :root {
        --bg: #0b0d10;
        --panel: #0e1116;
        --sunk: #11151b;
        --line: #1e2732;
        --fg: #c8ced8;
        --bright: #e6ebf2;
        --dim: #7c8798;
        --faint: #4d5765;
        --ok: #7fd0a0;
        --bad: #d08a7f;
        --warn: #d8c07f;
        --sans: "Segoe UI", system-ui, sans-serif;
        --mono: Consolas, "DejaVu Sans Mono", monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.45 var(--sans);
      }
      #brand {
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        text-align: center;
      }
      #brand b {
        color: var(--bright);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.14em;
      }
      /* The live heap readout sits in the flow under the bar. Nothing here
         scrolls the document itself, so it stays in view without being
         positioned over the wordmark. */
      #ramBox {
        overflow: hidden;
        padding: 5px 10px;
        border-bottom: 1px solid var(--line);
        background: var(--sunk);
        color: var(--ok);
        font: 11px/1.4 var(--mono);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* Running: a spinner under the bar. jb.js switches the body to .done,
         .fail or .log. */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid var(--line);
        border-top-color: var(--ok);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        display: none;
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.5px;
      }
      #state,
      #out {
        display: none;
      }
      body.done #spin,
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }
      body.done #msg {
        display: block;
        color: var(--ok);
        font-weight: 700;
        letter-spacing: 2px;
      }
      /* ?log=1 -- the full step log. Laid out with flex rather than by
         subtracting a header height from 100vh. */
      body.log {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        padding: 14px 18px 30px;
      }
      body.log #state {
        display: block;
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 700;
      }
      body.log #out {
        display: block;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--sunk);
        font: 12px/1.45 var(--mono);
        white-space: pre-wrap;
      }
      /* The retry notice, raised by jb.js when the chain throws or stalls. */
      .notice {
        margin: 1em 0;
        padding: 0.7em 1em;
        border: 2px solid #e66;
        background: #2a1414;
        color: #f99;
        font: 700 20px/1.4 var(--sans);
      }
      .byline {
        position: fixed;
        bottom: 9px;
        left: 11px;
        margin: 0;
        color: var(--faint);
        font: 11px/1 var(--mono);
        letter-spacing: 0.06em;
      }
      .ok {
        color: var(--ok);
      }
      .bad {
        color: var(--bad);
      }
      .warn {
        color: var(--warn);
      }
      code {
        color: #9fb3d0;
      }
    #bare-status{display:none}.barebone #out,.barebone #state,.barebone #ramBox{display:none!important}.barebone #bare-status{display:block;text-align:center;margin:35px 15px;color:#b9d5ff;font:16px Arial}.barebone .notice{display:none}</style>
  </head>
  <body>
    <!-- jb.js owns the body class: .log while the step log is shown, .done or
         .fail once the chain has settled. The ids below are its contract --
         #ramBox, #msg, #state and #out are read by name. -->
    <div id="brand"><b>WebKit Exploit</b></div>
    <div id="ramBox">RAM: checking...</div>
    <p id="bare-status" role="status">Running WebKit Exploit…</p><div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <p class="byline">by well0nez/m0zz</p>
    <script type="module">
      /* Inline before importing any upstream module; no exploit or payload is run by this guard. */
(function () {
  'use strict';
  var key = 'whatsite.afterglow.1402.arm.v1', stamp = 0, from = false, navigation = true;
  try { stamp = Number(sessionStorage.getItem(key)); sessionStorage.removeItem(key); } catch (_) {}
  try {
    var ref = new URL(document.referrer), here = location.pathname.replace(/[^/]*$/, '');
    from = ref.origin === location.origin && (ref.pathname === here || ref.pathname === here + 'index.html');
    navigation = performance.navigation.type === 0;
  } catch (_) { navigation = false; }
  var ua = navigator.userAgent.match(/PlayStation 4[\/ ](\d+\.\d{2})(?:\D|$)/i);
  var valid = ua && ['14.02'].indexOf(ua[1]) >= 0;
  var query = location.search;
  var target = query === '?log=1&afterglow=run&payload=hen.bin' || query === '?log=1&afterglow=run&mode=goldhen';
  if (valid && target && from && navigation && stamp > 0 && Date.now() - stamp >= 0 && Date.now() - stamp < 30000) {
/* Optional UI observer: only explicit upstream results may navigate away. */
(function(){
 'use strict';
 var settings={},retryKey='wwb.afterglow.1402.retry',usedKey=retryKey+'.used',finished=false,kernelSeen=false;
 try{settings=JSON.parse(localStorage.getItem('wwb.afterglow.1402.settings.v1')||'{}')||{};}catch(e){}
 var retry=settings.retry!==false,reload=settings.reload!==false,bare=settings.barebone===true;
 if(bare)document.documentElement.className+=' barebone';
 if(!(retry||reload||bare)||typeof MutationObserver==='undefined')return;
 var out=document.getElementById('out'),status=document.getElementById('bare-status');
 function inspect(){
  if(finished)return;
  var log=out.textContent||'',success=/(?:^|\n)AG  done(?:\n|$)/.test(log),defused=/(?:^|\n)AG  handles defused(?:\n|$)/.test(log);
  kernelSeen=kernelSeen||/(?:^|\n)AG(?:  |-)/.test(log);
  var early=/(?:^|\n)JB-THREW(?:  |\n|$)/.test(log)&&!kernelSeen;
  if(success){
   status.textContent='Jailbreak complete';
   if(defused){
    try{sessionStorage.setItem('wwb.afterglow.1402.completed','1');}catch(e){}
    finished=true;observer.disconnect();
    if(reload){
     var left=5,notice=document.createElement('p');notice.setAttribute('role','status');notice.style.cssText='text-align:center;color:#b9d5ff;font:16px Arial';out.parentNode.insertBefore(notice,out);
     function countdown(){notice.textContent='Jailbreak complete. Returning to the launcher in '+left+' seconds…';status.textContent=notice.textContent;}
     countdown();var timer=setInterval(function(){left--;if(left<=0){clearInterval(timer);location.replace('index.html?restored=1&result=success');}else countdown();},1000);
     window.addEventListener('pagehide',function(){clearInterval(timer);});
    }
   }
  }
  else if(early){
   status.textContent='WebKit attempt failed';
   if(retry){try{if(sessionStorage.getItem(usedKey)!=='1'){sessionStorage.setItem(usedKey,'1');sessionStorage.setItem(retryKey,String(Date.now()));finished=true;observer.disconnect();location.replace('index.html?restored=1&retry=1');}}catch(e){}}
  }else if(document.body.className.indexOf('fail')>=0)status.textContent='Attempt stopped. Reopen the browser; restart the console if the kernel stage ran.';
 }
 var observer=new MutationObserver(inspect);
 observer.observe(out,{childList:true});observer.observe(document.body,{attributes:true,attributeFilter:['class']});
}());

    import('./jb.js').catch(function () { document.body.className = 'fail'; document.getElementById('msg').textContent = 'Runtime dependency failed'; });
  } else {
    document.body.className = 'fail';
    document.getElementById('msg').textContent = 'Return to the landing page';
    location.replace('index.html?restored=1');
  }
})();

    </script>
  </body>
</html>
