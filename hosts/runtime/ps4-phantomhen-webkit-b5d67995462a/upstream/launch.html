<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PhantomHEN</title>
    <script>
      (function () {
        function crumb(m) {
          try { fetch("ag_log?m=" + encodeURIComponent(m), { keepalive: true }).catch(function () {}); } catch (e) {}
        }
        crumb("[page] launch.html alive " + location.search);
        window.addEventListener("error", function (e) {
          crumb("[page] error " + (e.message || e.type) + " @ " + (e.filename || "?") + ":" + (e.lineno || 0));
        });
        window.addEventListener("unhandledrejection", function (e) {
          var r = e.reason;
          crumb("[page] reject " + ((r && (r.message || r)) || "?"));
        });
      })();
    </script>
    <style>
      :root {
        --bg: #050000;
        --panel: #0a0000;
        --sunk: #0d0000;
        --line: #3d0000;
        --fg: #ffffff;
        --bright: #ffffff;
        --dim: #cc4444;
        --faint: #883333;
        --ok: #ff4444;
        --bad: #d08a7f;
        --warn: #d8c07f;
        --sans: "Segoe UI", system-ui, sans-serif;
        --mono: Consolas, "DejaVu Sans Mono", monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.45 var(--sans);
      }
      #brand {
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        text-align: center;
      }
      #brand b {
        color: var(--bright);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.14em;
      }
      #brand .collab {
        display: block;
        color: var(--ok);
        font-size: 10px;
        letter-spacing: 0.18em;
        text-shadow: 0 0 6px rgba(255,68,68,0.7);
        margin-top: 2px;
      }
      #ramBox {
        overflow: hidden;
        padding: 5px 10px;
        border-bottom: 1px solid var(--line);
        background: var(--sunk);
        color: var(--ok);
        font: 11px/1.4 var(--mono);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid var(--line);
        border-top-color: var(--ok);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        display: none;
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.5px;
      }
      #state,
      #out {
        display: none;
      }
      body.done #spin,
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }
      body.done #msg {
        display: block;
        color: var(--ok);
        font-weight: 700;
        letter-spacing: 2px;
      }
      body.log {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        padding: 14px 18px 30px;
      }
      body.log #state {
        display: block;
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 700;
      }
      body.log #out {
        display: block;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--sunk);
        font: 12px/1.45 var(--mono);
        white-space: pre-wrap;
      }
      .notice {
        margin: 1em 0;
        padding: 0.7em 1em;
        border: 2px solid #cc0000;
        background: #1a0000;
        color: #ff4444;
        font: 700 20px/1.4 var(--sans);
      }
      .byline {
        position: fixed;
        bottom: 9px;
        left: 11px;
        margin: 0;
        color: var(--faint);
        font: 11px/1 var(--mono);
        letter-spacing: 0.06em;
      }
      .ok   { color: var(--ok); }
      .bad  { color: var(--bad); }
      .warn { color: var(--warn); }
      code  { color: #ff4444; }
    </style>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="manifest" href="manifest.json">
  </head>
  <body>
    <div id="brand">
      <img src="logo.png" width="96" height="96" alt="PhantomHEN" style="object-fit:contain;vertical-align:middle">
      <b>PhantomHEN</b>
      <span class="collab">iDntUseModz</span>
    </div>
    <div id="ramBox">RAM: checking...</div>
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="retryNotice" class="notice" hidden></div>
      <div id="out"></div>
    </div>
    <p class="byline">iDntUseModz</p>
    <script src="payload-data.js?v=phantomhen307"></script>
    <script type="module">
      import "./jb-g.js?v=phantomhen307";
    </script>
  </body>
</html>
