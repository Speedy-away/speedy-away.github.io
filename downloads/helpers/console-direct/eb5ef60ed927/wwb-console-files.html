  '<div class="cf-layout"><aside class="cf-connect cf-collapsed" id="cf-connection-panel"><button type="button" class="cf-connection-toggle" id="cf-connection-toggle" aria-expanded="false">Connection settings · IP &amp; port</button><h3>01 / Connection</h3><div id="cf-public"><p>Start the file helper on a computer on your network. Open its address on this device to use FTP.</p><a id="cf-helper-download" class="cf-primary" href="/docs/console-files-helper.json">Download file helper</a><label>Helper computer IP<input id="cf-pc" placeholder="192.168.1.20" inputmode="decimal"></label><label>Helper web port<input id="cf-web-port" value="8787" type="number" min="1" max="65535"></label><button id="cf-open">Open helper</button><p class="cf-muted">Same Wi-Fi on phone and computer. Run Start for phones.cmd. Node.js 22+ is required; install 7-Zip for archives.</p></div>'+

  '<section data-panel="archives" hidden><h3>02 / Extract an archive</h3><p>Inspect its contents, then extract only the files you choose.</p><p class="cf-formats">ZIP · RAR · 7Z · TAR · GZ · TGZ · BZ2 · XZ</p><label class="cf-file-picker">Choose archive<input id="cf-archive-input" type="file" accept=".zip,.rar,.7z,.tar,.gz,.tgz,.bz2,.xz"></label><p class="cf-muted">7-Zip runs on your helper computer. Archive: 256 MiB maximum; each extracted file: 64 MiB. Password-protected or incomplete multipart archives are not supported. Extracted entries are saved as regular files. For .tar.gz, extract the TAR, then inspect it again.</p><div id="cf-entries" class="cf-file-list"><p class="cf-empty">Archive contents appear here.</p></div><div id="cf-extracted" hidden><p id="cf-extracted-name"></p><div class="cf-row"><button id="cf-extracted-upload">Use in file uploads</button><button id="cf-extracted-save">Save to this device</button></div></div></section>'+
  '<section data-panel="plugins" hidden><div class="cf-section-title"><h3>02 / GoldHEN plugins</h3><button id="cf-read-ini">Read from console</button></div><p>Place <code>.prx</code> / <code>.sprx</code> files in <code>/data/GoldHEN/plugins/</code>. The configuration lives at <code>/data/GoldHEN/plugins.ini</code>.</p><div class="cf-preset"><h4>Add a game or plugin preset</h4><label>Preset<select id="cf-preset"></select></label><div class="cf-row"><label class="cf-grow">Installed game title ID<input id="cf-title" placeholder="CUSA00001" maxlength="9" autocapitalize="characters"></label><label class="cf-check"><input type="checkbox" id="cf-global"> All games</label></div><label>Plugin filename<input id="cf-plugin-name" placeholder="your_plugin.sprx" spellcheck="false"></label><label class="cf-check"><input id="cf-enable-plugin" type="checkbox"> Enable this entry (I checked the game update and plugin compatibility)</label><button id="cf-add-preset">Add to editor</button><p class="cf-muted">Game presets create a section for your own title ID. They do not guarantee compatibility. Entries start commented out unless enabled above.</p></div><label for="cf-editor">plugins.ini editor</label><textarea id="cf-editor" rows="12" spellcheck="false" placeholder="Read your console config, import a file, or add a preset."></textarea><div class="cf-row"><label class="cf-file-picker">Import .ini<input id="cf-import" type="file" accept=".ini,text/plain"></label><button id="cf-export">Download plugins.ini</button><button id="cf-save-ini" class="cf-primary">Save to console + backup</button></div><p class="cf-muted">Read the current console file before saving. Existing sections and comments remain. A timestamped backup is kept beside plugins.ini. Enable the plugin loader in GoldHEN settings. <a href="https://github.com/GoldHEN/GoldHEN_Plugins_Repository" target="_blank" rel="noopener">Plugin documentation</a></p></section></div></div>'+

  function el(id){return document.getElementById('cf-'+id);}
  function message(text){el('status').textContent=text;}
  function config(){return {host:location.hostname,port:Number(location.port||80),user:'',password:''};}
  function identity(){return JSON.stringify(config());}
  function changeTab(name){Array.prototype.forEach.call(mount.querySelectorAll('[data-panel]'),function(p){p.hidden=p.getAttribute('data-panel')!==name;});Array.prototype.forEach.call(mount.querySelectorAll('[data-tab]'),function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-tab')===name));});}
  function setBusy(value){busy=value;el('progress').hidden=!value;Array.prototype.forEach.call(mount.querySelectorAll('button,input,select,textarea'),function(n){n.disabled=value;});el('title').disabled=value||el('global').checked;}
  function task(fn){if(busy)return;setBusy(true);Promise.resolve().then(fn).catch(function(e){message(e.message);}).then(function(){setBusy(false);});}
  function api(route,data,blob){return window.WWBDirect.api(route,data,blob);/*if(!helper||!paired)return Promise.reject(Error('Open the file helper and pair this device to use console transfers.'));return fetch('/api/'+route,{method:data?'POST':'GET',headers:{'X-WWB-Pair':token,'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined}).then(function(r){if(!r.ok)return r.json().then(function(e){throw Error(e.error||'Request failed.');});return blob?r.blob():r.json();});*/}
  function download(blob,name){var a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},30000);}
  function stage(file){return window.WWBDirect.stage(file);}
  function stagedList(){el('staged').textContent='';staged.forEach(function(item){var button=document.createElement('button');button.textContent=item.name+' · '+size(item.bytes);button.className=item===selected?'cf-chosen':'';button.onclick=function(){selected=item;stagedList();};el('staged').appendChild(button);});}
  function size(n){return n>=1048576?(n/1048576).toFixed(1)+' MiB':n>=1024?(n/1024).toFixed(1)+' KiB':n+' B';}
  function full(name){return directory.replace(/\/$/,'')+'/'+name;}
  function list(){message('Reading console folder…');return api('list',{connection:config(),path:el('path').value}).then(function(r){directory=r.path;el('path').value=directory;el('files').textContent='';selection=null;el('selection').hidden=true;if(!r.files.length)el('files').textContent='This folder is empty.';r.files.sort(function(a,b){return Number(b.directory)-Number(a.directory)||a.name.localeCompare(b.name);}).forEach(function(f){var row=document.createElement('button');row.className='cf-file-row';var name=document.createElement('span'),meta=document.createElement('span');name.textContent=(f.directory?'▸ ':'')+f.name;meta.textContent=f.link?'Link':f.directory?'Folder':size(f.size);row.appendChild(name);row.appendChild(meta);row.onclick=function(){if(f.link)return message('Symbolic links are not opened by this workspace.');if(/[\\/\x00-\x1f]/.test(f.name))return message('Unsupported filename.');selection=f;el('selection').hidden=false;el('selected-name').textContent=f.name;el('move-path').value=full(f.name);el('download').hidden=f.directory;el('open-selection').hidden=!f.directory;};el('files').appendChild(row);});el('state').textContent='Connected · '+config().host;try{localStorage.setItem('wwb-files-address',JSON.stringify({host:config().host,port:config().port}));}catch(_){}message('Opened '+directory+'.');});}
  function addAction(id,fn){if(!el(id))return;el(id).addEventListener('click',function(){task(fn);});}
  Array.prototype.forEach.call(mount.querySelectorAll('[data-tab]'),function(b){b.onclick=function(){changeTab(b.getAttribute('data-tab'));};});
  Array.prototype.forEach.call(document.querySelectorAll('[data-workspace]'),function(a){a.onclick=function(e){e.preventDefault();var name=a.getAttribute('data-workspace'),desk=document.getElementById('host-download-desk');mount.hidden=name==='downloads';desk.classList.toggle('cf-workspace-open',name!=='downloads');if(name!=='downloads')changeTab(name);Array.prototype.forEach.call(document.querySelectorAll('[data-workspace]'),function(link){link.setAttribute('aria-current',link===a?'page':'false');});};});
  Array.prototype.forEach.call(mount.querySelectorAll('[data-path]'),function(b){b.onclick=function(){el('path').value=b.getAttribute('data-path');task(list);};});
  var unusedToggle={};unusedToggle.onclick=function(){var collapsed=el('connection-panel').classList.toggle('cf-collapsed');this.setAttribute('aria-expanded',String(!collapsed));};
  el('public').hidden=true;el('local').hidden=true;el('connect-form').hidden=true;el('connection-panel').classList.remove('cf-collapsed');el('connection-panel').innerHTML='<h3>Direct to your PS4</h3><p>No computer helper. Requests go only to this console.</p><p id=direct-address></p><a class=cf-primary href=/ target=_blank rel=noopener>Open native file manager</a><p class=cf-muted>Use the native manager for archives, USB storage, folders and files larger than 8 MiB.</p>';document.getElementById('direct-address').textContent=location.host;
  if(!helper){fetch('/docs/console-files-helper.json').then(function(r){return r.json();}).then(function(m){el('helper-download').href=m.url;el('helper-download').setAttribute('download','');}).catch(function(){el('helper-download').textContent='Helper download unavailable';el('helper-download').removeAttribute('href');});}
  var unusedOpen={};unusedOpen.onclick=function(){var host=el('pc').value.trim(),port=Number(el('web-port').value),parts=host.split('.').map(Number);if(!/^\d+\.\d+\.\d+\.\d+$/.test(host)||parts.join('.')!==host||parts.some(function(n){return n>255;})||!(parts[0]===192&&parts[1]===168||parts[0]===10||parts[0]===172&&parts[1]>=16&&parts[1]<=31)||!Number.isInteger(port)||port<1||port>65535)return message('Enter the helper computer LAN IP and web port.');location.href='http://'+host+':'+port+'/';};
  addAction('pair-button',function(){token=el('pair').value.trim();paired=true;return api('status').then(function(r){el('state').textContent='Helper paired';el('pair').value='';el('archive-support').textContent=r.archive?'Archive engine ready.':'Install 7-Zip on the helper computer for archive extraction.';message(r.message+' Enter the console IP and FTP port.');},function(e){paired=false;throw e;});});
  var unusedConnectForm={};unusedConnectForm.onsubmit=function(e){e.preventDefault();el('path').value='/data';task(list);};
  el('path-form').onsubmit=function(e){e.preventDefault();task(list);};
  addAction('prepare-plugins',function(){return api('mkdir',{connection:config(),path:'/data/GoldHEN/plugins'}).then(function(){el('path').value='/data/GoldHEN/plugins';return list();});});
  addAction('refresh',list);addAction('up',function(){el('path').value=directory.split('/').slice(0,-1).join('/')||'/';return list();});
  el('folder-form').onsubmit=function(e){e.preventDefault();task(function(){var name=el('folder-name').value.trim();if(!name||/[\\/\x00-\x1f]/.test(name)||name==='.'||name==='..')throw Error('Enter a folder name without slashes.');return api('mkdir',{connection:config(),path:full(name)}).then(list);});};
  addAction('open-selection',function(){if(!selection||!selection.directory)return;el('path').value=full(selection.name);return list();});
  addAction('move',function(){if(!selection)throw Error('Select a file first.');return api('move',{connection:config(),from:full(selection.name),to:el('move-path').value}).then(function(r){return list().then(function(){message('Moved to '+r.path);});});});
  addAction('download',function(){if(!selection)throw Error('Select a file first.');var name=selection.name;return api('download',{connection:config(),path:full(name)},true).then(function(blob){download(blob,name);message('File received. Your browser handles saving it.');});});
  el('upload-input').onchange=function(){var files=Array.prototype.slice.call(this.files);task(function(){return files.reduce(function(p,file){return p.then(function(){return stage(file).then(function(item){staged.push(item);selected=item;stagedList();});});},Promise.resolve()).then(function(){message('Files ready. Select a file and destination, then upload.');});});this.value='';};
  addAction('upload-send',function(){if(!selected)throw Error('Choose a local file first.');var target=el('upload-destination').value.replace(/\/$/,'')+'/'+selected.name;message('Sending '+selected.name+' to the console…');return api('upload',{connection:config(),id:selected.id,path:target}).then(function(r){if(/\.(s?prx)$/i.test(selected.name))el('plugin-name').value=selected.name;message('Saved '+r.path+' · '+size(r.bytes)+'.'+(/\.(s?prx)$/i.test(selected.name)?' Open GoldHEN plugins to add this filename to your config.':''));});});
  var archivePanel=mount.querySelector('[data-panel=archives]');archivePanel.innerHTML='<h3>Extract directly on PS4</h3><p>Open the native file manager, upload your RAR, ZIP or 7z to a new folder, select the archive and choose Extract. Keep the original archive and use a new destination folder.</p><a class=cf-primary href=/ target=_blank rel=noopener>Open native file manager</a><p class=cf-muted>The console handles extraction. No computer or 7-Zip installation is needed. Format and password support depend on your installed ezRemote version.</p>';
  var plugins=window.WWBPlugins;plugins.presets.forEach(function(p){var o=document.createElement('option');o.value=p.id;o.textContent=p.name;el('preset').appendChild(o);});
  el('preset').onchange=function(){var p=plugins.presets.filter(function(x){return x.id===el('preset').value;})[0];el('plugin-name').value=p.file;};
  el('global').onchange=function(){el('title').disabled=this.checked;};
  addAction('add-preset',function(){var r=plugins.merge(el('editor').value,el('global').checked?'default':el('title').value.trim().toUpperCase(),el('plugin-name').value.trim(),el('enable-plugin').checked);el('editor').value=r.text;message(r.added?'Entry added to the editor. Review before saving.':'This entry is already present; its current state was preserved.');});
  addAction('read-ini',function(){if(el('editor').value&&!window.confirm('Replace the editor with the current console config? Download your draft first if needed.'))return;return api('ini-read',{connection:config()}).then(function(r){el('editor').value=r.text;iniHash=r.sha256;iniConnection=identity();message(r.exists?'Read current plugins.ini. Existing comments and entries are preserved.':'No plugins.ini exists. Add your entries to create one.');});});
  addAction('save-ini',function(){if(!iniHash||iniConnection!==identity())throw Error('Read plugins.ini from this console before saving.');return api('ini-save',{connection:config(),text:el('editor').value,sha256:iniHash}).then(function(r){iniHash=r.sha256;message('Saved plugins.ini.'+(r.backup?' Backup: '+r.backup:' New configuration created.'));});});
  el('export').onclick=function(){download(new Blob([el('editor').value],{type:'text/plain'}),'plugins.ini');message('Config ready to save on this device.');};
  el('import').onchange=function(){var file=this.files[0];if(!file)return;if(file.size>1048576)return message('Config must be under 1 MiB.');if(el('editor').value&&!window.confirm('Replace the editor with this file?'))return;var reader=new FileReader();reader.onload=function(){el('editor').value=reader.result;message('Imported into editor only. Review before saving to your console.');};reader.onerror=function(){message('Could not read the selected config.');};reader.readAsText(file);this.value='';};
  
}());
